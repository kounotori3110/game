<title>金田のモテ期は来るっていうふうな？</title>
<style>
*{box-sizing:border-box}
:root{--navy:#102b49;--pink:#ff4d9b;--blue:#6cc9ff;--paper:rgba(9,25,45,.88)}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Meiryo",system-ui,sans-serif;background:#bde8ff;color:white}
button{font:inherit;cursor:pointer}
#screen{position:relative;width:100%;height:100dvh;min-height:440px;overflow:hidden;background:linear-gradient(#70c8ff 0%,#d4f0ff 48%,#f8d5e3 100%)}
#sceneBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#topline{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:2}
.badge{background:rgba(12,39,67,.78);border:1px solid rgba(255,255,255,.65);border-radius:999px;padding:7px 12px;font-weight:800;font-size:clamp(11px,1.8vw,14px);backdrop-filter:blur(5px)}
#title{font-size:clamp(17px,3vw,27px);font-weight:1000;text-shadow:0 2px 5px #153c61}
#characters{position:absolute;inset:0;pointer-events:none}
.char{position:absolute;bottom:18%;height:min(73vh,690px);width:min(45vw,500px);filter:drop-shadow(0 14px 12px #18344b44);transition:opacity .25s,transform .25s}
#kaneda{left:1%;height:min(65vh,570px);width:min(38vw,400px)}
#yo{right:1%}
#atsushi{right:1%;height:min(76vh,700px)}
.char svg{height:100%;width:100%;overflow:visible}
#who{position:absolute;left:16px;bottom:clamp(205px,27vh,260px);z-index:3;background:var(--pink);border:2px solid white;border-radius:9px;padding:6px 13px;font-weight:1000;font-size:clamp(14px,2vw,18px);box-shadow:0 3px 0 #a72862}
#chat{position:absolute;z-index:4;left:12px;right:12px;bottom:12px;height:clamp(190px,26vh,245px);border:2px solid rgba(255,255,255,.88);border-radius:18px;background:var(--paper);box-shadow:0 8px 28px #142d4666;backdrop-filter:blur(12px);display:flex;flex-direction:column;padding:13px 15px 12px}
#dialog{font-size:clamp(15px,2.2vw,21px);line-height:1.65;white-space:pre-line;overflow:auto;flex:1;padding:2px 2px 8px}
#choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.choice{border:2px solid #c7eaff;background:#f9fdff;color:#153b5d;border-radius:12px;padding:10px 9px;font-weight:800;font-size:clamp(12px,1.7vw,15px);box-shadow:0 3px 0 #7cb6d9;min-height:44px}
.choice:hover{background:#ffe5f1;border-color:#ff85b8}
#bottomInfo{position:absolute;right:18px;bottom:clamp(220px,29vh,270px);z-index:3;background:rgba(12,39,67,.78);border:1px solid white;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:800}
#start{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(#123d5b55,#12243c99);padding:20px}
.startcard{max-width:560px;width:100%;background:rgba(9,25,45,.86);border:2px solid white;border-radius:22px;padding:25px;box-shadow:0 15px 45px #12263e66}
.startcard h1{font-size:clamp(28px,6vw,52px);line-height:1.15;color:#ff9bc5;text-shadow:2px 3px #102b49;margin:0 0 12px}
.startcard p{line-height:1.8}
#startBtn,#again{border:0;background:linear-gradient(90deg,#ff4d9b,#ff7ab5);color:white;border-radius:14px;padding:13px 24px;font-size:18px;font-weight:1000;box-shadow:0 4px 0 #a72862}
#endcard{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:#081b2c99;padding:20px}
#endinner{max-width:560px;width:100%;background:#fff8fc;color:#17344c;border:3px solid white;border-radius:20px;padding:24px;text-align:center}
#endinner h2{color:#e83e8c;font-size:clamp(24px,5vw,38px)}
#endText{white-space:pre-line;line-height:1.8}
/* スマホ優先レイアウト */
@media(max-width:650px){
 html,body{height:100%;min-height:100%;overflow:hidden}
 #screen{height:100dvh;min-height:0;width:100%;}
 #topline{top:7px;left:7px;right:7px;gap:5px;align-items:flex-start}
 #title{font-size:clamp(13px,4vw,17px);line-height:1.25;max-width:64%}
 .badge{font-size:10px;padding:6px 8px;max-width:42%;text-align:center}
 .char{bottom:39%;height:38vh;width:58vw;max-height:330px}
 #kaneda{left:-8%;height:34vh;width:49vw;max-height:295px}
 #yo,#atsushi{right:-7%}
 #who{left:7px;bottom:calc(clamp(245px,42dvh,330px) + 7px);font-size:12px;padding:5px 8px}
 #bottomInfo{right:7px;bottom:calc(clamp(245px,42dvh,330px) + 7px);font-size:10px;padding:5px 7px}
 #chat{left:5px;right:5px;bottom:5px;height:clamp(245px,42dvh,330px);padding:8px;border-radius:14px;gap:4px}
 #dialog{font-size:clamp(14px,3.8vw,16px);line-height:1.45;padding:1px 2px 4px;min-height:40px}
 #choices{grid-template-columns:1fr;gap:5px}
 .choice{padding:7px 8px;min-height:36px;font-size:13px;border-radius:10px;box-shadow:0 2px 0 #7cb6d9}
 #start,#endcard{padding:10px;overflow:auto}
 .startcard{padding:18px 14px;border-radius:17px;max-height:94dvh;overflow:auto}
 .startcard h1{font-size:clamp(26px,8vw,38px)}
 .startcard p{font-size:14px;line-height:1.6}
 #startBtn,#again{font-size:16px;padding:11px 20px}
 #endinner{padding:16px;max-height:94dvh;overflow:auto}
}
@media(max-width:380px){
 #title{font-size:13px}
 .badge{font-size:9px;padding:5px 6px}
 #chat{height:clamp(255px,45dvh,345px)}
 #who,#bottomInfo{bottom:calc(clamp(255px,45dvh,345px) + 7px)}
 .char{bottom:41%;height:35vh}
 #kaneda{height:31vh}
 .choice{font-size:12px;min-height:34px;padding:6px}
}
@media(orientation:landscape) and (max-height:500px) and (max-width:900px){

 #dialog{font-size:12px;line-height:1.3}
 #choices{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
 .choice{font-size:11px;padding:5px;min-height:30px}
 .char{height:66vh;bottom:48%;width:34vw}
 #kaneda{height:57vh;width:28vw}
 #who,#bottomInfo{bottom:calc(48dvh + 7px);font-size:10px}
}
@media(max-height:550px) and (min-width:651px){
 .char{height:68vh;bottom:28%}#kaneda{height:60vh}
 #chat{height:190px}#who,#bottomInfo{bottom:205px}
}
</style>

<script>
const story=[
 {day:'1日目・大学の正門',who:'金田（心の声）',face:'kaneda',text:'俺はなぜ大学にいるっていうふうな。受付の人に「新入生ですか？」と聞かれた。どう見ても新入生じゃないっていうふうな。',opts:[['青春を探しに来たっていうふうな',1,0],['見学だとおもうならだまって俺に目線を向けろ！！',0,1],['出口を探しているっていうふうな',0,0]]},

 {day:'2日目・図書室のすみ',who:'新谷 敦',face:'atsushi',text:'「実は……恋愛相談所の看板、僕が作ったんです。金田さんが来てくれたら……うれしい、です」\\n看板の『恋』だけ裏返しだった。',opts:[['一緒に直すっていうふうな',1,2],['大切に飾るっていうふうな',0,2],['裏返しも個性だっていうふうな',0,1]]},

];

const $=id=>document.getElementById(id);
function startGame(){i=0;y=0;a=0;$('start').style.display='none';$('endcard').style.display='none';$('chat').style.display='flex';render();}
function render(){const s=story[i];$('day').textContent=s.day;$('who').textContent=s.who;$('dialog').textContent=s.text;$('ys').textContent=y;$('as').textContent=a;['kaneda','yo','atsushi'].forEach(id=>$(id).style.opacity=(id===s.face?'1':'.10'));['kaneda','yo','atsushi'].forEach(id=>$(id).style.transform=(id===s.face?'translateY(0) scale(1.02)':'translateY(14px) scale(.96)'));const box=$('choices');box.innerHTML='';s.opts.forEach((o,n)=>{let b=document.createElement('button');b.className='choice';b.textContent=(n+1)+'　'+o[0];b.onclick=()=>pick(o);box.appendChild(b)});}
function pick(o){if(o[3]){end(o[3]);return;}y+=o[1];a+=o[2];i++;if(i>=story.length)end('S');else render();}
function end(route){$('endcard').style.display='flex';$('ys').textContent=y;$('as').textContent=a;let title,text;if(route==='Y'&&y>=a){title='よういちろーエンド：毛先まで、なんだが';text='よういちろー「金田、これからも一緒に髪型研究するんだが！」\\n金田「恋愛より先に研究費が必要……ていふうな」\\n二人は毛先の自由研究サークルを結成したんだが。初回の活動は左右の毛先を同じ方向に曲げることだったっていうふうな。';}else if(route==='A'&&a>=y){title='新谷敦エンド：口元の向こうの本音';text='敦「金田さんといると、少しだけ話せる気がします……」\\n金田「ゆっくりでいい。俺も若者言葉はゆっくり覚える……ていふうな」\\n二人は学園祭の割引券を使い切るため、喫茶店を7軒巡った。8軒目は定休日だった。';}else if(route==='S'){title='真エンド：金田、出口を発見';text='金田は気づいた。恋をする前に、まず出口を見つけるべきだったっていうふうな。\\n「青春とは迷子から始まる……ていふうな」\\n出口は最初から、ずっと右側にあったっていうふうな。';}else{title='バッドエンド：口癖しか残らない';text='金田「〜ていふうな」\\nよういちろー「〜なんだが」\\n敦「……あの……」\\n会話は口癖だけになり、話の内容が消えた。なぜか学園祭のアンケートは高評価だったっていうふうな話なんだが。';}$('endTitle').textContent=title;$('endText').textContent=text;$('finalScores').textContent='最終好感度：よういちろー '+y+' ／ 敦 '+a;}
</script>
</body></html>
