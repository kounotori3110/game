
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元素音声チャレンジ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  font-family: sans-serif;
  background: #eef5ff;
  text-align: center;
  color: #24334a;
}

main {
  max-width: 550px;
  margin: auto;
}

h1 {
  color: #2865b5;
  font-size: 27px;
}

.panel {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-top: 15px;
  box-shadow: 0 3px 12px #00000012;
}

button, select {
  font-size: 17px;
  padding: 13px;
  border-radius: 12px;
  border: none;
  margin: 5px;
}

button {
  background: #3478d4;
  color: white;
  cursor: pointer;
}

button:disabled {
  opacity: 0.4;
}

select {
  background: #edf3fc;
}

#number {
  font-size: 22px;
  color: #6480a5;
}

#element {
  font-size: 45px;
  font-weight: bold;
  margin: 15px 0;
}

#symbol {
  font-size: 24px;
  color: #6480a5;
}

#status {
  font-size: 19px;
  font-weight: bold;
  min-height: 30px;
  margin: 15px 0;
}

#heard {
  color: #777;
  min-height: 25px;
}

#progress {
  height: 14px;
  background: #dce5f1;
  border-radius: 20px;
  overflow: hidden;
  margin: 15px 0;
}

#bar {
  width: 0%;
  height: 100%;
  background: #39b878;
  transition: width 0.3s;
}

#mic {
  font-size: 23px;
  padding: 18px 35px;
  background: #e34c65;
}

.small {
  font-size: 14px;
  color: #777;
}

#mistakes {
  text-align: left;
  line-height: 1.8;
}

.hidden {
  display: none;
}
</style>
</head>

<body>
<main>

<h1>🎤 元素音声チャレンジ</h1>
<p>118元素を順番に声で覚えよう！</p>

<div class="panel" id="setup">
  <h2>チャレンジ設定</h2>

  <p>どこまで挑戦する？</p>

  <select id="range">
    <option value="20">1〜20番</option>
    <option value="40">1〜40番</option>
    <option value="60">1〜60番</option>
    <option value="80">1〜80番</option>
    <option value="100">1〜100番</option>
    <option value="118">1〜118番</option>
  </select>

  <br>
  <button onclick="startGame()">スタート！</button>
</div>

<div class="panel hidden" id="game">

  <div id="number">1 / 20</div>

  <div id="progress">
    <div id="bar"></div>
  </div>

  <div id="element">水素</div>
  <div id="symbol">H</div>

  <div id="status">マイクを準備してね</div>
  <div id="heard">認識した言葉：---</div>

  <button id="mic" onclick="toggleMic()">🎤 聞き取り開始</button>

  <p class="small">
    元素の名前を声に出してね。<br>
    正解すると自動で次へ進むよ！
  </p>

  <hr>

  <p>
    正解数：<span id="correct">0</span>
    ／
    間違い：<span id="wrong">0</span>
  </p>

  <button onclick="pauseGame()">一時停止</button>
  <button onclick="resetGame()">最初から</button>
</div>

<div class="panel hidden" id="result">
  <h2>🎉 チャレンジ終了！</h2>
  <h1 id="resultScore">118 / 118</h1>
  <p id="resultText"></p>
  <button onclick="resetGame()">もう一度挑戦</button>
</div>

<div class="panel hidden" id="review">
  <h2>間違えた元素</h2>
  <div id="mistakes"></div>
</div>

</main>

<script>

// 元素データ
// 番号、元素名、読み方、記号

const elements = [
[1,"水素","スイソ","H"],
[2,"ヘリウム","ヘリウム","He"],
[3,"リチウム","リチウム","Li"],

[5,"ホウ素","ホウソ","B"],

[11,"ナトリウム","ナトリウム","Na"],

[13,"アルミニウム","アルミニウム","Al"],
[14,"ケイ素","ケイソ","Si"],
[15,"リン","リン","P"],

[24,"クロム","クロム","Cr"],

[34,"セレン","セレン","Se"],
[35,"臭素","シュウソ","Br"],
[36,"クリプトン","クリプトン","Kr"],
[37,"ルビジウム","ルビジウム","Rb"],
[38,"ストロンチウム","ストロンチウム","Sr"],
[39,"イットリウム","イットリウム","Y"],
[40,"ジルコニウム","ジルコニウム","Zr"],
[41,"ニオブ","ニオブ","Nb"],
[42,"モリブデン","モリブデン","Mo"],

[56,"バリウム","バリウム","Ba"],

[88,"ラジウム","ラジウム","Ra"],

[92,"ウラン","ウラン","U"],
[93,"ネプツニウム","ネプツニウム","Np"],

[95,"アメリシウム","アメリシウム","Am"],
[96,"キュリウム","キュリウム","Cm"],

[99,"アインスタイニウム","アインスタイニウム","Es"],
[100,"フェルミウム","フェルミウム","Fm"],
[101,"メンデレビウム","メンデレビウム","Md"],
[102,"ノーベリウム","ノーベリウム","No"],
[103,"ローレンシウム","ローレンシウム","Lr"],
[104,"ラザホージウム","ラザホージウム","Rf"],
[105,"ドブニウム","ドブニウム","Db"],
[106,"シーボーギウム","シーボーギウム","Sg"],
[107,"ボーリウム","ボーリウム","Bh"],
[108,"ハッシウム","ハッシウム","Hs"],
[109,"マイトネリウム","マイトネリウム","Mt"],
[110,"ダームスタチウム","ダームスタチウム","Ds"],
[111,"レントゲニウム","レントゲニウム","Rg"],
[112,"コペルニシウム","コペルニシウム","Cn"],
[113,"ニホニウム","ニホニウム","Nh"],
[114,"フレロビウム","フレロビウム","Fl"],
[115,"モスコビウム","モスコビウム","Mc"],
[116,"リバモリウム","リバモリウム","Lv"],
[117,"テネシン","テネシン","Ts"],
[118,"オガネソン","オガネソン","Og"]
];

let current = 0;
let limit = 20;
let correct = 0;
let wrong = 0;
let mistakes = [];
let recognition = null;
let listening = false;
let paused = false;
let restarting = false;
let sessionId = 0;

// ひらがなをカタカナに変換
function normalize(text) {
  return text
    .normalize("NFKC")
    .replace(/[ぁ-ゖ]/g, c =>
      String.fromCharCode(c.charCodeAt(0) + 96)
    )
    .replace(/[\s、。,.！？!?]/g, "")
    .replace(/元素|は/g, "");
}

function startGame() {
  limit = Number(document.getElementById("range").value);
  current = 0;
  correct = 0;
  wrong = 0;
  mistakes = [];

  document.getElementById("setup").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("review").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  updateScreen();
}

function updateScreen() {
  const e = elements[current];

  document.getElementById("number").textContent =
    (current + 1) + " / " + limit;

  document.getElementById("element").textContent = e[1];
  document.getElementById("symbol").textContent = e[3];

  document.getElementById("bar").style.width =
    (current / limit * 100) + "%";

  document.getElementById("correct").textContent = correct;
  document.getElementById("wrong").textContent = wrong;

  document.getElementById("status").textContent =
    "「" + e[1] + "」と言ってみよう！";

  document.getElementById("heard").textContent =
    "認識した言葉：---";
}

function toggleMic() {
  if (listening) {
    stopMic();
  } else {
    startMic();
  }
}

function startMic() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("このブラウザは音声認識に対応していないよ。Google Chromeで開いてみてね。");
    return;
  }

  if (current >= limit) return;

  sessionId++;
  const thisSession = sessionId;

  recognition = new SpeechRecognition();
  recognition.lang = "ja-JP";
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 3;

  listening = true;
  paused = false;
  restarting = false;

  document.getElementById("mic").textContent = "🔴 聞き取り中（停止）";
  document.getElementById("status").textContent = "聞いているよ！";

  recognition.onresult = function(event) {
    if (thisSession !== sessionId || !listening) return;

    for (let i = event.resultIndex; i < event.results.length; i++) {
      const result = event.results[i];
      const transcript = result[0].transcript;

      document.getElementById("heard").textContent =
        "認識した言葉：" + transcript;

      if (result.isFinal) {
        checkAnswer(transcript, thisSession);
      }
    }
  };

  recognition.onerror = function(event) {
    if (thisSession !== sessionId) return;

    if (event.error === "not-allowed" ||
        event.error === "service-not-allowed") {
      stopMic();
      document.getElementById("status").textContent =
        "マイクの使用を許可してね。";
    }
  };

  recognition.onend = function() {
    if (thisSession !== sessionId) return;

    if (listening && !paused && !restarting) {
      restarting = true;
      setTimeout(() => {
        restarting = false;
        if (listening && thisSession === sessionId) {
          try {
            recognition.start();
          } catch(e) {}
        }
      }, 300);
    }
  };

  try {
    recognition.start();
  } catch(e) {
    stopMic();
    document.getElementById("status").textContent =
      "マイクを開始できなかったよ。もう一度試してね。";
  }
}

function checkAnswer(spoken, thisSession) {
  if (thisSession !== sessionId || !listening) return;

  const expected = elements[current][2];
  const heard = normalize(spoken);
  const target = normalize(expected);

  // 読み方と一致したか確認
  if (heard.includes(target) || target.includes(heard) && heard.length >= 2) {

    correct++;

    document.getElementById("status").textContent = "⭕ 正解！";
    document.getElementById("status").style.color = "#20a66a";

    current++;

    if (current >= limit) {
      stopMic();
      finishGame();
      return;
    }

    setTimeout(() => {
      if (thisSession !== sessionId || !listening) return;

      updateScreen();
      document.getElementById("status").textContent =
        "次の元素を言ってね！";
      document.getElementById("status").style.color = "#24334a";
    }, 600);

  } else {
    // 同じ元素で何度も間違いを記録しない
    if (!mistakes.includes(current)) {
      mistakes.push(current);
      wrong++;
      document.getElementById("wrong").textContent = wrong;
    }

    document.getElementById("status").textContent =
      "もう一度言ってみよう！";
    document.getElementById("status").style.color = "#d65a5a";
  }
}

function stopMic() {
  listening = false;
  paused = false;
  sessionId++;

  if (recognition) {
    recognition.onend = null;
    try {
      recognition.stop();
    } catch(e) {}
    recognition = null;
  }

  document.getElementById("mic").textContent = "🎤 聞き取り開始";
}

function pauseGame() {
  if (listening) {
    stopMic();
    paused = true;
    document.getElementById("status").textContent =
      "一時停止中。再開ボタンを押してね。";
    document.getElementById("mic").textContent = "▶ 再開";
  } else if (paused) {
    startMic();
  } else {
    document.getElementById("status").textContent =
      "マイクを開始してね。";
  }
}

function resetGame() {
  stopMic();

  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("review").classList.add("hidden");
  document.getElementById("setup").classList.remove("hidden");
}

function finishGame() {
  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  document.getElementById("resultScore").textContent =
    correct + " / " + limit;

  document.getElementById("resultText").textContent =
    "間違いは " + wrong + " 回だったよ！";

  document.getElementById("review").classList.remove("hidden");

  if (mistakes.length === 0) {
    document.getElementById("mistakes").textContent =
      "全問正解！すごい！";
  } else {
    document.getElementById("mistakes").innerHTML =
      mistakes.map(i =>
        elements[i][0] + "番：" + elements[i][1] +
        "（" + elements[i][3] + "）"
      ).join("<br>");
  }

  document.getElementById("bar").style.width = "100%";
}

</script>
</body>
</html>
