<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NEON RUNNER 3D</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080d19;
  color: white;
  font-family: Arial, sans-serif;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

#game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#hud {
  position: fixed;
  top: max(12px, env(safe-area-inset-top));
  left: 12px;
  right: 12px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  pointer-events: none;
  z-index: 2;
}

.stat {
  background: rgba(7, 13, 29, .78);
  border: 1px solid rgba(102, 232, 255, .55);
  box-shadow: 0 0 14px rgba(0, 210, 255, .12);
  border-radius: 12px;
  padding: 8px 11px;
  min-width: 76px;
  text-align: center;
  backdrop-filter: blur(5px);
}

.stat small {
  display: block;
  color: #9cb4d5;
  font-size: 10px;
  letter-spacing: 1px;
  margin-bottom: 3px;
}

.stat strong {
  font-size: 18px;
  color: #ffffff;
}

#brand {
  position: fixed;
  top: max(12px, env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 2px;
  color: #68efff;
  text-shadow: 0 0 12px #00cfff;
  pointer-events: none;
  z-index: 2;
  white-space: nowrap;
}

#pauseButton {
  position: fixed;
  top: max(68px, calc(env(safe-area-inset-top) + 58px));
  right: 12px;
  width: 42px;
  height: 42px;
  border-radius: 12px;
  border: 1px solid #4a789c;
  background: rgba(8, 18, 36, .8);
  color: white;
  font-size: 19px;
  z-index: 4;
}

#controls {
  position: fixed;
  left: 0;
  right: 0;
  bottom: max(15px, env(safe-area-inset-bottom));
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  padding: 0 14px;
  z-index: 3;
  pointer-events: none;
}

.control {
  pointer-events: auto;
  height: clamp(55px, 8vh, 76px);
  border: 1px solid rgba(127, 225, 255, .7);
  border-radius: 18px;
  background: rgba(9, 24, 45, .78);
  color: white;
  font-size: 14px;
  font-weight: bold;
  box-shadow: 0 0 16px rgba(0, 183, 255, .12);
  touch-action: none;
}

.control span {
  display: block;
  font-size: 24px;
  line-height: 1.2;
}

#jumpButton {
  border-color: rgba(255, 221, 105, .8);
  background: rgba(65, 49, 18, .82);
}

#slideButton {
  border-color: rgba(122, 255, 214, .8);
  background: rgba(12, 57, 52, .82);
}

button:active {
  filter: brightness(1.5);
  transform: scale(.97);
}

#overlay {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px;
  background: rgba(4, 8, 19, .56);
  backdrop-filter: blur(5px);
  z-index: 5;
}

#panel {
  width: min(100%, 400px);
  padding: 27px 20px;
  text-align: center;
  background: linear-gradient(155deg, rgba(17, 35, 65, .98), rgba(7, 13, 29, .98));
  border: 1px solid #48dcff;
  border-radius: 24px;
  box-shadow: 0 0 35px rgba(0, 208, 255, .18);
}

#panel h1 {
  margin: 0 0 8px;
  font-size: clamp(28px, 8vw, 42px);
  line-height: 1.1;
  color: #73f1ff;
  text-shadow: 0 0 18px rgba(0, 217, 255, .6);
}

#panel p {
  color: #c2d4ed;
  line-height: 1.8;
  font-size: 14px;
}

#mainButton {
  width: 100%;
  margin-top: 8px;
  padding: 15px;
  color: #071322;
  background: linear-gradient(90deg, #5be8ff, #8bffda);
  border: 0;
  border-radius: 13px;
  font-weight: 900;
  font-size: 18px;
  box-shadow: 0 0 22px rgba(66, 230, 255, .25);
}

#result {
  margin-top: 12px;
  color: #ffe17c;
  font-size: 14px;
  line-height: 1.8;
}

.hidden {
  display: none !important;
}

#toast {
  position: fixed;
  top: 24%;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 18px;
  background: rgba(6, 18, 37, .85);
  color: #7ef6ff;
  border: 1px solid #5cecff;
  border-radius: 30px;
  font-weight: bold;
  opacity: 0;
  transition: opacity .15s;
  pointer-events: none;
  z-index: 4;
}

@media (orientation: landscape) {
  #controls {
    left: auto;
    width: min(46%, 440px);
    right: 10px;
    bottom: max(10px, env(safe-area-inset-bottom));
    padding: 0;
    gap: 6px;
  }

  .control {
    height: 52px;
    font-size: 11px;
    border-radius: 12px;
  }

  .control span {
    font-size: 19px;
  }

  #hud {
    right: auto;
    width: min(50%, 410px);
  }

  #brand {
    top: 12px;
  }

  #pauseButton {
    top: auto;
    bottom: max(72px, calc(env(safe-area-inset-bottom) + 65px));
    right: 12px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="stat">
    <small>DISTANCE</small>
    <strong id="distance">0 m</strong>
  </div>
  <div class="stat">
    <small>COINS</small>
    <strong id="coins">0</strong>
  </div>
  <div class="stat">
    <small>SPEED</small>
    <strong id="speed">1.0x</strong>
  </div>
</div>

<div id="brand">NEON RUNNER 3D</div>

<button id="pauseButton" aria-label="一時停止">Ⅱ</button>

<div id="controls">
  <button class="control" id="leftButton"><span>◀</span>LEFT</button>
  <button class="control" id="jumpButton"><span>⬆</span>JUMP</button>
  <button class="control" id="rightButton"><span>▶</span>RIGHT</button>
  <button class="control" id="slideButton" style="grid-column:1/4;height:45px;">
    ⬇ SLIDE
  </button>
</div>

<div id="toast"></div>

<div id="overlay">
  <div id="panel">
    <h1 id="panelTitle">NEON<br>RUNNER 3D</h1>
    <p id="panelText">
      3つのレーンを駆け抜けろ。<br>
      障害物を避け、コインを集めよう。<br><br>
      <b>左右スワイプ</b>：レーン移動<br>
      <b>上スワイプ</b>：ジャンプ<br>
      <b>下スワイプ</b>：スライディング
    </p>
    <button id="mainButton">RUN START ▶</button>
    <div id="result"></div>
  </div>
</div>

<script>
"use strict";

/* =========================
   基本設定
========================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const distanceUI = document.getElementById("distance");
const coinsUI = document.getElementById("coins");
const speedUI = document.getElementById("speed");

const overlay = document.getElementById("overlay");
const panelTitle = document.getElementById("panelTitle");
const panelText = document.getElementById("panelText");
const mainButton = document.getElementById("mainButton");
const resultUI = document.getElementById("result");
const toast = document.getElementById("toast");

let W = innerWidth;
let H = innerHeight;
let dpr = 1;

function resize() {
  W = innerWidth;
  H = innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => {
  setTimeout(resize, 100);
});

let state = "menu";
let lastTime = 0;
let elapsed = 0;
let distance = 0;
let coinCount = 0;
let speed = 1;
let roadScroll = 0;
let spawnTimer = 0;
let coinTimer = 0;
let shake = 0;
let flash = 0;
let bestDistance = 0;

try {
  bestDistance = Number(sessionStorage.getItem("neonBest") || 0);
} catch (_) {}

const player = {
  lane: 1,
  laneVisual: 1,
  jump: 0,
  jumpVelocity: 0,
  slide: 0,
  run: 0,
  blink: 0
};

let obstacles = [];
let coins = [];
let particles = [];
let scenery = [];
let streaks = [];

/* =========================
   3レーンの道路
========================= */

function horizonY() {
  return H * 0.26;
}

function roadHalfWidth(z) {
  const far = Math.max(0, Math.min(1, z));
  return W * (0.075 + 0.44 * far);
}

function roadCenter() {
  return W * 0.5;
}

function roadY(z) {
  return horizonY() + (H * 1.02 - horizonY()) * z;
}

function laneX(lane, z) {
  // lane 0 = 左、1 = 中央、2 = 右
  return roadCenter() + (lane - 1) * roadHalfWidth(z) * 0.65;
}

function scaleAt(z) {
  return 0.16 + Math.max(0, z) * 1.15;
}

/* =========================
   ゲームの開始・終了
========================= */

function resetGame() {
  elapsed = 0;
  distance = 0;
  coinCount = 0;
  speed = 1;
  roadScroll = 0;
  spawnTimer = 0.8;
  coinTimer = 1.2;
  shake = 0;
  flash = 0;

  player.lane = 1;
  player.laneVisual = 1;
  player.jump = 0;
  player.jumpVelocity = 0;
  player.slide = 0;
  player.run = 0;
  player.blink = 0;

  obstacles = [];
  coins = [];
  particles = [];
  scenery = [];
  streaks = [];

  for (let i = 0; i < 20; i++) {
    scenery.push({
      side: Math.random() < 0.5 ? -1 : 1,
      z: Math.random(),
      type: Math.random() < 0.5 ? "light" : "tower",
      seed: Math.random()
    });
  }

  updateHUD();
}

function startGame() {
  resetGame();
  state = "playing";
  overlay.classList.add("hidden");
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function pauseGame() {
  if (state === "playing") {
    state = "paused";
    showPanel(
      "PAUSED",
      "休憩中だよ。<br>準備ができたら再開しよう。",
      "▶ 再開",
      "resume"
    );
  } else if (state === "paused") {
    state = "playing";
    overlay.classList.add("hidden");
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }
}

function gameOver() {
  if (state !== "playing") return;

  state = "over";
  shake = 16;
  flash = 0.6;

  const finalDistance = Math.floor(distance);

  if (finalDistance > bestDistance) {
    bestDistance = finalDistance;
    try {
      sessionStorage.setItem("neonBest", String(bestDistance));
    } catch (_) {}
  }

  showPanel(
    "RUN OVER",
    "ラン終了！<br>もう一度挑戦して記録を更新しよう。",
    "↻ もう一度遊ぶ",
    "restart"
  );

  resultUI.innerHTML =
    "DISTANCE：<b>" + finalDistance + " m</b><br>" +
    "COINS：<b>" + coinCount + "</b><br>" +
    "BEST：<b>" + bestDistance + " m</b>";

  addBurst(W * 0.5, H * 0.63, "#ff5c77", 28);
}

function showPanel(title, text, buttonText, action) {
  panelTitle.innerHTML = title;
  panelText.innerHTML = text;
  mainButton.textContent = buttonText;
  mainButton.dataset.action = action;
  overlay.classList.remove("hidden");
}

mainButton.addEventListener("click", () => {
  const action = mainButton.dataset.action;

  if (action === "resume") {
    pauseGame();
  } else {
    startGame();
  }
});

document.getElementById("pauseButton").addEventListener("pointerdown", e => {
  e.preventDefault();
  pauseGame();
});

/* =========================
   操作
========================= */

function moveLeft() {
  if (state !== "playing") return;
  player.lane = Math.max(0, player.lane - 1);
}

function moveRight() {
  if (state !== "playing") return;
  player.lane = Math.min(2, player.lane + 1);
}

function jump() {
  if (state !== "playing") return;

  if (player.jump <= 0 && player.slide <= 0) {
    player.jumpVelocity = H * 1.05;
    player.jump = 0.001;
  }
}

function slide() {
  if (state !== "playing") return;

  if (player.jump <= 0) {
    player.slide = 0.7;
  }
}

function bindControl(id, action) {
  const button = document.getElementById(id);

  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    action();
  });
}

bindControl("leftButton", moveLeft);
bindControl("rightButton", moveRight);
bindControl("jumpButton", jump);
bindControl("slideButton", slide);

window.addEventListener("keydown", e => {
  if ([
    "ArrowLeft", "ArrowRight", "ArrowUp",
    "ArrowDown", " ", "a", "d", "w", "s"
  ].includes(e.key)) {
    e.preventDefault();
  }

  if (state === "menu" || state === "over") {
    if (e.key === "Enter" || e.key === " ") startGame();
    return;
  }

  if (state === "paused") {
    if (e.key === "Escape" || e.key === "Enter") pauseGame();
    return;
  }

  if (e.key === "ArrowLeft" || e.key === "a") moveLeft();
  if (e.key === "ArrowRight" || e.key === "d") moveRight();
  if (e.key === "ArrowUp" || e.key === "w" || e.key === " ") jump();
  if (e.key === "ArrowDown" || e.key === "s") slide();
  if (e.key === "Escape") pauseGame();
});

// スワイプはゲーム画面で受け取る。
// 操作ボタン上のタッチとは混ざらない。
let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;
let pointerActive = false;
let pointerId = null;

canvas.addEventListener("pointerdown", e => {
  if (state !== "playing") return;
  if (e.pointerType === "mouse" && e.button !== 0) return;

  pointerActive = true;
  pointerId = e.pointerId;
  touchStartX = e.clientX;
  touchStartY = e.clientY;
  touchStartTime = performance.now();

  try {
    canvas.setPointerCapture(e.pointerId);
  } catch (_) {}

  e.preventDefault();
});

canvas.addEventListener("pointerup", e => {
  if (!pointerActive || e.pointerId !== pointerId) return;

  pointerActive = false;

  const dx = e.clientX - touchStartX;
  const dy = e.clientY - touchStartY;
  const ax = Math.abs(dx);
  const ay = Math.abs(dy);
  const threshold = Math.max(24, Math.min(42, W * 0.055));

  if (Math.max(ax, ay) < threshold) {
    // 画面の短いタップでもジャンプできる
    jump();
  } else if (ax > ay) {
    if (dx < 0) moveLeft();
    else moveRight();
  } else {
    if (dy < 0) jump();
    else slide();
  }

  e.preventDefault();
});

canvas.addEventListener("pointercancel", () => {
  pointerActive = false;
  pointerId = null;
});

/* =========================
   障害物の生成
========================= */

function spawnObstacle(lane, type, z = 0) {
  obstacles.push({
    lane,
    type,
    z,
    hit: false,
    seed: Math.random()
  });
}

function spawnPattern() {
  // 3レーンを全部使うパターンから選ぶ
  const pattern = Math.floor(Math.random() * 7);

  if (pattern === 0) {
    // 1レーンだけ障害物、残りにコイン
    const blocked = Math.floor(Math.random() * 3);
    spawnObstacle(blocked, "block");

    for (let lane = 0; lane < 3; lane++) {
      if (lane !== blocked) {
        spawnCoinLine(lane, 4, 0, 0.09);
      }
    }
  }

  else if (pattern === 1) {
    // 2つの障害物。安全なレーンを選ぶ
    const safe = Math.floor(Math.random() * 3);

    for (let lane = 0; lane < 3; lane++) {
      if (lane !== safe) {
        spawnObstacle(lane, Math.random() < 0.5 ? "block" : "bar");
      } else {
        spawnCoinLine(lane, 5, 0, 0.085);
      }
    }
  }

  else if (pattern === 2) {
    // ジャンプで越える障害物の列
    const lane = Math.floor(Math.random() * 3);
    spawnObstacle(lane, "block");
    spawnCoinLine(lane, 4, -0.13, 0.07);
  }

  else if (pattern === 3) {
    // コインの道が左から右へ移動
    const sequence = [0, 1, 2, 1, 0];

    sequence.forEach((lane, i) => {
      coins.push({
        lane,
        z: -i * 0.11,
        got: false,
        spin: Math.random() * 6
      });
    });

    const blockLane = Math.floor(Math.random() * 3);
    spawnObstacle(blockLane, "bar", -0.2);
  }

  else if (pattern === 4) {
    // 連続してレーンを移動する必要がある
    const first = Math.floor(Math.random() * 3);
    const second = (first + 1 + Math.floor(Math.random() * 2)) % 3;

    spawnObstacle(first, "block");
    spawnObstacle(second, "bar", -0.34);
    spawnCoinLine((second + 1) % 3, 4, -0.1, 0.085);
  }

  else if (pattern === 5) {
    // 低いバーを避けるかスライディング
    const lane = Math.floor(Math.random() * 3);
    spawnObstacle(lane, "bar");

    const otherLane = (lane + 1 + Math.floor(Math.random() * 2)) % 3;
    spawnCoinLine(otherLane, 5, 0, 0.08);
  }

  else {
    // 全レーンに順番に障害物
    const first = Math.floor(Math.random() * 3);
    spawnObstacle(first, "block");
    spawnObstacle((first + 1) % 3, "gap", -0.42);
    spawnCoinLine((first + 2) % 3, 4, -0.12, 0.08);
  }
}

function spawnCoinLine(lane, count, startZ = 0, spacing = 0.075) {
  for (let i = 0; i < count; i++) {
    coins.push({
      lane,
      z: startZ - i * spacing,
      got: false,
      spin: Math.random() * Math.PI * 2
    });
  }
}

/* =========================
   更新処理
========================= */

function update(dt) {
  elapsed += dt;
  distance += dt * 15 * speed;
  speed = Math.min(2.8, 1 + distance / 650);

  roadScroll = (roadScroll + dt * speed * 0.75) % 1;
  player.run += dt * speed * 11;

  // レーン移動をなめらかに
  player.laneVisual +=
    (player.lane - player.laneVisual) * Math.min(1, dt * 13);

  // ジャンプ物理
  if (player.jump > 0) {
    player.jump += player.jumpVelocity * dt;
    player.jumpVelocity -= H * 2.8 * dt;

    if (player.jump <= 0) {
      player.jump = 0;
      player.jumpVelocity = 0;
      addBurst(laneX(player.lane, 1), H * 0.78, "#6beeff", 5);
    }
  }

  if (player.slide > 0) {
    player.slide = Math.max(0, player.slide - dt);
  }

  spawnTimer -= dt;

  if (spawnTimer <= 0) {
    spawnPattern();

    // 速度に応じて出現間隔を少し短くする
    spawnTimer = Math.max(0.72, 1.35 / speed) + Math.random() * 0.48;
  }

  coinTimer -= dt;

  if (coinTimer <= 0) {
    const lane = Math.floor(Math.random() * 3);
    spawnCoinLine(lane, 4 + Math.floor(Math.random() * 4));
    coinTimer = 2.2 + Math.random() * 1.4;
  }

  // 障害物の移動と当たり判定
  for (const o of obstacles) {
    o.z += dt * 0.39 * speed;

    if (!o.hit && o.z >= 0.86 && o.z <= 1.04) {
      const sameLane = o.lane === player.lane;

      if (sameLane) {
        let safe = false;

        if (o.type === "block" || o.type === "gap") {
          safe = player.jump > 38;
        } else if (o.type === "bar") {
          safe = player.slide > 0.12;
        }

        if (!safe) {
          o.hit = true;
          shake = 14;
          flash = 0.5;
          gameOver();
          return;
        } else {
          o.hit = true;
          addBurst(laneX(o.lane, 1), H * 0.75, "#7affdc", 6);
        }
      }
    }
  }

  obstacles = obstacles.filter(o => o.z < 1.18);

  // コインの移動と取得
  for (const c of coins) {
    c.z += dt * 0.39 * speed;
    c.spin += dt * 8;

    if (!c.got && c.z >= 0.87 && c.z <= 1.04 && c.lane === player.lane) {
      c.got = true;
      coinCount++;
      addBurst(laneX(c.lane, c.z), roadY(c.z) - 35, "#ffe06b", 9);
    }
  }

  coins = coins.filter(c => c.z < 1.15 && !c.got);

  // 道路脇の景色
  for (const s of scenery) {
    s.z += dt * 0.25 * speed;

    if (s.z > 1.1) {
      s.z = 0;
      s.side = Math.random() < 0.5 ? -1 : 1;
      s.type = Math.random() < 0.5 ? "light" : "tower";
      s.seed = Math.random();
    }
  }

  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += H * 0.55 * dt;
    p.life -= dt;
  }

  particles = particles.filter(p => p.life > 0);

  shake = Math.max(0, shake - dt * 35);
  flash = Math.max(0, flash - dt * 1.5);

  updateHUD();
}

function updateHUD() {
  distanceUI.textContent = Math.floor(distance) + " m";
  coinsUI.textContent = coinCount;
  speedUI.textContent = speed.toFixed(1) + "x";
}

/* =========================
   描画：背景
========================= */

function drawBackground() {
  const hy = horizonY();

  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#071023");
  sky.addColorStop(0.48, "#182a4c");
  sky.addColorStop(0.7, "#263a5b");
  sky.addColorStop(1, "#090f1d");

  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // 星
  for (let i = 0; i < 48; i++) {
    const x = ((i * 137.5) % W);
    const y = ((i * 73.7) % Math.max(1, hy * 0.9));
    const r = (i % 3 === 0) ? 1.5 : 0.7;

    ctx.fillStyle = i % 4 === 0
      ? "rgba(108,235,255,.9)"
      : "rgba(255,255,255,.5)";

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // 遠くの未来都市
  const buildingBase = hy + 16;

  for (let i = 0; i < 22; i++) {
    const bw = W / 17;
    const x = i * W / 19 - 5;
    const bh = hy * (0.13 + ((i * 37) % 100) / 240);

    ctx.fillStyle = i % 2
      ? "#142743"
      : "#1a2b4a";

    ctx.fillRect(x, buildingBase - bh, bw, bh);

    ctx.fillStyle = "rgba(75,220,255,.42)";

    for (let row = 0; row < 4; row++) {
      const wy = buildingBase - bh + 8 + row * 12;

      if (wy < buildingBase - 2) {
        ctx.fillRect(x + 4, wy, 3, 4);
        ctx.fillRect(x + bw - 8, wy, 3, 4);
      }
    }
  }

  // 地平線の光
  const glow = ctx.createLinearGradient(0, hy - 10, 0, hy + 55);
  glow.addColorStop(0, "rgba(30,220,255,0)");
  glow.addColorStop(0.6, "rgba(30,220,255,.16)");
  glow.addColorStop(1, "rgba(30,220,255,0)");

  ctx.fillStyle = glow;
  ctx.fillRect(0, hy - 10, W, 65);
}

/* =========================
   描画：3レーン道路
========================= */

function drawRoad() {
  const hy = horizonY();
  const topW = roadHalfWidth(0) * 2;
  const bottomW = roadHalfWidth(1) * 2;

  // 道路本体
  const roadGradient = ctx.createLinearGradient(0, hy, 0, H);
  roadGradient.addColorStop(0, "#26354c");
  roadGradient.addColorStop(0.5, "#182437");
  roadGradient.addColorStop(1, "#111b2a");

  ctx.fillStyle = roadGradient;
  ctx.beginPath();
  ctx.moveTo(roadCenter() - topW / 2, hy);
  ctx.lineTo(roadCenter() + topW / 2, hy);
  ctx.lineTo(roadCenter() + bottomW / 2, H + 30);
  ctx.lineTo(roadCenter() - bottomW / 2, H + 30);
  ctx.closePath();
  ctx.fill();

  // 道路の外側のネオン
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#3ceaff";
  ctx.shadowBlur = 14;
  ctx.shadowColor = "#00d9ff";

  ctx.beginPath();
  ctx.moveTo(roadCenter() - topW / 2, hy);
  ctx.lineTo(roadCenter() - bottomW / 2, H + 20);

  ctx.moveTo(roadCenter() + topW / 2, hy);
  ctx.lineTo(roadCenter() + bottomW / 2, H + 20);
  ctx.stroke();

  ctx.shadowBlur = 0;

  // 道路を横切るスピードライン
  for (let i = 0; i < 18; i++) {
    const z = ((i / 18 + roadScroll) % 1);
    const y = roadY(z);
    const half = roadHalfWidth(z);

    ctx.strokeStyle = `rgba(105,180,220,${0.03 + z * 0.08})`;
    ctx.lineWidth = 1 + z * 2;

    ctx.beginPath();
    ctx.moveTo(roadCenter() - half, y);
    ctx.lineTo(roadCenter() + half, y);
    ctx.stroke();
  }

  // 3レーンを区切る線
  // 左レーン｜中央レーン｜右レーン
  for (let divider = -1; divider <= 1; divider += 2) {
    ctx.beginPath();

    for (let i = 0; i <= 30; i++) {
      const z = i / 30;
      const x = roadCenter() + divider * roadHalfWidth(z) / 3;
      const y = roadY(z);

      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }

    ctx.setLineDash([15, 13]);
    ctx.lineDashOffset = -roadScroll * 100;
    ctx.strokeStyle = "rgba(185,228,255,.65)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  ctx.setLineDash([]);

  // 3レーンを視覚的に分かりやすくする薄い色
  for (let lane = 0; lane < 3; lane++) {
    const x1 = laneX(lane, 0);
    const x2 = laneX(lane, 1);
    const y1 = hy;
    const y2 = H;

    ctx.fillStyle = lane === 1
      ? "rgba(74,195,255,.025)"
      : "rgba(74,195,255,.012)";

    ctx.beginPath();
    ctx.moveTo(x1 - roadHalfWidth(0) / 3, y1);
    ctx.lineTo(x1 + roadHalfWidth(0) / 3, y1);
    ctx.lineTo(x2 + roadHalfWidth(1) / 3, y2);
    ctx.lineTo(x2 - roadHalfWidth(1) / 3, y2);
    ctx.closePath();
    ctx.fill();
  }
}

/* =========================
   描画：道路脇の景色
========================= */

function drawScenery() {
  for (const s of scenery) {
    const z = s.z;
    const scale = scaleAt(z);
    const x = roadCenter() +
      s.side * (roadHalfWidth(z) + 20 * scale);
    const y = roadY(z);
    const size = scale * 35;

    if (s.type === "light") {
      ctx.strokeStyle = "rgba(80,220,255,.5)";
      ctx.lineWidth = Math.max(1, 2 * scale);

      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x, y - size * 2);
      ctx.stroke();

      ctx.fillStyle = "#74f5ff";
      ctx.shadowBlur = 12 * scale;
      ctx.shadowColor = "#00dfff";

      ctx.beginPath();
      ctx.arc(x, y - size * 2, Math.max(1.5, 4 * scale), 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0;
    } else {
      const width = size * 0.65;
      const height = size * 2.4;

      ctx.fillStyle = "#152a45";
      ctx.fillRect(x - width / 2, y - height, width, height);

      ctx.fillStyle = "rgba(75,220,255,.65)";

      for (let row = 0; row < 3; row++) {
        ctx.fillRect(
          x - width * 0.25,
          y - height + size * 0.3 + row * size * 0.45,
          width * 0.5,
          Math.max(1, size * 0.1)
        );
      }
    }
  }
}

/* =========================
   描画：障害物
========================= */

function drawObstacle(o) {
  const z = Math.max(0, o.z);
  const x = laneX(o.lane, z);
  const y = roadY(z);
  const s = scaleAt(z);

  if (o.type === "block") {
    const w = 42 * s;
    const h = 52 * s;

    // 影
    ctx.fillStyle = "rgba(0,0,0,.32)";
    ctx.beginPath();
    ctx.ellipse(x, y + 2 * s, w * 0.75, 7 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    // 立体的な箱の側面
    ctx.fillStyle = "#87333e";
    ctx.beginPath();
    ctx.moveTo(x - w / 2, y - h);
    ctx.lineTo(x - w / 2 + 9 * s, y - h - 8 * s);
    ctx.lineTo(x + w / 2 + 9 * s, y - h - 8 * s);
    ctx.lineTo(x + w / 2, y - h);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#ff526b";
    ctx.fillRect(x - w / 2, y - h, w, h);

    ctx.fillStyle = "#ff9caa";
    ctx.fillRect(x - w / 2 + 4 * s, y - h + 4 * s, 5 * s, h - 8 * s);

    ctx.fillStyle = "#642738";
    ctx.fillRect(x - w / 2, y - 8 * s, w, 8 * s);

    ctx.strokeStyle = "#ffc3cd";
    ctx.lineWidth = Math.max(1, 1.4 * s);
    ctx.strokeRect(x - w / 2, y - h, w, h);
  }

  if (o.type === "bar") {
    const w = 66 * s;
    const h = 9 * s;
    const pole = 34 * s;

    // 支柱
    ctx.fillStyle = "#65748c";
    ctx.fillRect(x - w / 2, y - pole, 5 * s, pole);
    ctx.fillRect(x + w / 2 - 5 * s, y - pole, 5 * s, pole);

    // バー
    ctx.fillStyle = "#ffcb50";
    ctx.fillRect(x - w / 2, y - pole, w, h);

    ctx.fillStyle = "#252b38";

    for (let i = 0; i < 5; i++) {
      ctx.save();
      ctx.translate(x - w / 2 + (i + 0.5) * w / 5, y - pole + h / 2);
      ctx.rotate(-0.65);
      ctx.fillRect(-2 * s, -h * 0.9, 4 * s, h * 1.8);
      ctx.restore();
    }

    ctx.strokeStyle = "#fff0b3";
    ctx.lineWidth = Math.max(1, s);
    ctx.strokeRect(x - w / 2, y - pole, w, h);
  }

  if (o.type === "gap") {
    const w = 68 * s;
    const h = 13 * s;

    ctx.fillStyle = "#03060c";
    ctx.beginPath();
    ctx.ellipse(x, y - 1 * s, w / 2, h, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#ff9e52";
    ctx.lineWidth = Math.max(1, 2 * s);
    ctx.stroke();

    ctx.strokeStyle = "rgba(255,190,100,.6)";
    ctx.beginPath();
    ctx.ellipse(x, y - 1 * s, w * 0.34, h * 0.6, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
}

/* =========================
   描画：コイン
========================= */

function drawCoin(c) {
  const z = Math.max(0, c.z);
  const x = laneX(c.lane, z);
  const y = roadY(z) - 28 * scaleAt(z);
  const s = scaleAt(z);

  const r = 10 * s;
  const squish = 0.45 + Math.abs(Math.sin(c.spin)) * 0.55;

  // 光
  ctx.fillStyle = "rgba(255,210,70,.13)";
  ctx.beginPath();
  ctx.arc(x, y, r * 2.2, 0, Math.PI * 2);
  ctx.fill();

  // 厚み
  ctx.fillStyle = "#a66a0b";
  ctx.beginPath();
  ctx.ellipse(x + 2 * s, y + 2 * s, r * squish, r, 0, 0, Math.PI * 2);
  ctx.fill();

  // コイン本体
  const gold = ctx.createLinearGradient(x - r, y, x + r, y);
  gold.addColorStop(0, "#ffb52e");
  gold.addColorStop(0.45, "#fff5a0");
  gold.addColorStop(1, "#ffb71b");

  ctx.fillStyle = gold;
  ctx.beginPath();
  ctx.ellipse(x, y, r * squish, r, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#fff7b9";
  ctx.lineWidth = Math.max(1, 1.5 * s);
  ctx.stroke();

  ctx.fillStyle = "#b97910";
  ctx.font = `bold ${Math.max(7, 12 * s)}px Arial`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  if (squish > 0.55) {
    ctx.fillText("$", x, y);
  }
}

/* =========================
   描画：棒人間キャラクター
========================= */

function drawPlayer() {
  const x = laneX(player.laneVisual, 1);
  const floorY = H * 0.79;

  const jumpHeight = Math.max(0, player.jump);
  const y = floorY - jumpHeight;
  const sliding = player.slide > 0;
  const run = Math.sin(player.run * 1.4);
  const stride = run * 17;

  // 接地影
  ctx.fillStyle = `rgba(0,0,0,${Math.max(.08, .27 - jumpHeight / H)})`;
  ctx.beginPath();
  ctx.ellipse(
    x,
    floorY + 6,
    Math.max(10, 28 - jumpHeight * 0.04),
    Math.max(3, 8 - jumpHeight * 0.01),
    0, 0, Math.PI * 2
  );
  ctx.fill();

  ctx.save();
  ctx.translate(x, y);

  if (sliding) {
    drawSlidingStick();
  } else {
    drawRunningStick(stride);
  }

  ctx.restore();
}

function drawRunningStick(stride) {
  // 足の長さ・太さ
  const hipY = -28;
  const legLength = 34;
  const legWidth = 11;

  // 足の後ろ側
  drawLimb(
    -4, hipY,
    -10 + stride * 0.6, hipY + legLength,
    legWidth, "#3b8fdd"
  );

  drawLimb(
    4, hipY,
    10 - stride * 0.6, hipY + legLength,
    legWidth, "#2674c2"
  );

  // 靴
  drawShoe(-10 + stride * 0.6, hipY + legLength, -1);
  drawShoe(10 - stride * 0.6, hipY + legLength, 1);

  // 胴体：少し立体的な角丸形
  const bodyGrad = ctx.createLinearGradient(-18, -80, 18, -20);
  bodyGrad.addColorStop(0, "#e8f5ff");
  bodyGrad.addColorStop(0.4, "#91b6d7");
  bodyGrad.addColorStop(1, "#486b91");

  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.roundRect(-15, -83, 30, 58, 10);
  ctx.fill();

  ctx.strokeStyle = "#d7f4ff";
  ctx.lineWidth = 2;
  ctx.stroke();

  // 胸のライン
  ctx.strokeStyle = "rgba(255,255,255,.5)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-7, -73);
  ctx.lineTo(7, -73);
  ctx.stroke();

  // 腕：走るアニメーション
  drawLimb(
    -12, -72,
    -20 - stride * 0.75, -47 + stride * 0.25,
    10, "#a9d6f5"
  );

  drawLimb(
    12, -72,
    20 + stride * 0.75, -47 - stride * 0.25,
    10, "#709bc3"
  );

  // 手
  drawHand(-20 - stride * 0.75, -47 + stride * 0.25);
  drawHand(20 + stride * 0.75, -47 - stride * 0.25);

  // 首
  const neckGrad = ctx.createLinearGradient(-5, -96, 5, -84);
  neckGrad.addColorStop(0, "#e6f4ff");
  neckGrad.addColorStop(1, "#6585a7");

  ctx.fillStyle = neckGrad;
  ctx.fillRect(-5, -96, 10, 14);

  // 頭
  const headGrad = ctx.createLinearGradient(-16, -135, 16, -98);
  headGrad.addColorStop(0, "#ffffff");
  headGrad.addColorStop(0.42, "#c4e1f6");
  headGrad.addColorStop(1, "#6687a7");

  ctx.fillStyle = headGrad;
  ctx.beginPath();
  ctx.ellipse(0, -115, 16, 20, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#e7f7ff";
  ctx.lineWidth = 2;
  ctx.stroke();

  // 顔の向きが分かる目
  ctx.fillStyle = "#13263a";
  ctx.beginPath();
  ctx.ellipse(5, -117, 3.2, 4.5, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(6, -119, 1.2, 0, Math.PI * 2);
  ctx.fill();

  // 頭のハイライト
  ctx.strokeStyle = "rgba(255,255,255,.8)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(-4, -120, 8, 3.5, 5.1);
  ctx.stroke();
}

function drawLimb(x1, y1, x2, y2, width, color) {
  // 外側の影で太い3D風の手足にする
  ctx.lineCap = "round";

  ctx.strokeStyle = "rgba(0,0,0,.32)";
  ctx.lineWidth = width + 3;
  ctx.beginPath();
  ctx.moveTo(x1 + 2, y1 + 3);
  ctx.lineTo(x2 + 2, y2 + 3);
  ctx.stroke();

  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();

  ctx.strokeStyle = "rgba(255,255,255,.4)";
  ctx.lineWidth = Math.max(1.5, width * 0.22);
  ctx.beginPath();
  ctx.moveTo(x1 - width * 0.2, y1);
  ctx.lineTo(x2 - width * 0.2, y2);
  ctx.stroke();
}

function drawHand(x, y) {
  ctx.fillStyle = "#d5edff";
  ctx.beginPath();
  ctx.arc(x, y, 6, 0, Math.PI * 2);
  ctx.fill();
}

function drawShoe(x, y, side) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(side * 0.15);

  ctx.fillStyle = "rgba(0,0,0,.35)";
  ctx.beginPath();
  ctx.ellipse(0, 1, 12, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  const shoe = ctx.createLinearGradient(0, -8, 0, 5);
  shoe.addColorStop(0, "#f7ffff");
  shoe.addColorStop(1, "#6787a6");

  ctx.fillStyle = shoe;
  ctx.beginPath();
  ctx.roundRect(-10, -6, 20, 12, 5);
  ctx.fill();

  ctx.fillStyle = "#27364b";
  ctx.fillRect(-10, 3, 20, 3);

  ctx.restore();
}

function drawSlidingStick() {
  // 横向きの棒人間
  ctx.save();
  ctx.rotate(0.9);

  const body = ctx.createLinearGradient(-15, -6, 15, 6);
  body.addColorStop(0, "#f1fbff");
  body.addColorStop(0.5, "#94b8d8");
  body.addColorStop(1, "#557595");

  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.roundRect(-24, -9, 48, 18, 9);
  ctx.fill();

  ctx.strokeStyle = "#e7f8ff";
  ctx.lineWidth = 2;
  ctx.stroke();

  // 頭
  ctx.fillStyle = "#d9efff";
  ctx.beginPath();
  ctx.arc(29, -4, 12, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#14273b";
  ctx.beginPath();
  ctx.arc(33, -5, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // 腕と足
  drawLimb(-9, 0, -23, 15, 8, "#8ab3d8");
  drawLimb(5, 1, 19, 13, 8, "#a6cce9");
  drawLimb(-15, 0, -31, 3, 9, "#4384bf");
  drawLimb(10, 0, 30, 1, 9, "#4384bf");

  ctx.restore();
}

/* =========================
   エフェクト
========================= */

function addBurst(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const power = 35 + Math.random() * 180;

    particles.push({
      x,
      y,
      vx: Math.cos(angle) * power,
      vy: Math.sin(angle) * power - 25,
      life: 0.35 + Math.random() * 0.55,
      maxLife: 0.9,
      size: 2 + Math.random() * 5,
      color
    });
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.maxLife));
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 8;
    ctx.shadowColor = p.color;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

/* =========================
   メイン描画
========================= */

function draw() {
  if (!ctx || W <= 0 || H <= 0) return;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  ctx.save();

  if (shake > 0) {
    ctx.translate(
      (Math.random() - 0.5) * shake,
      (Math.random() - 0.5) * shake
    );
  }

  drawBackground();
  drawScenery();
  drawRoad();

  // 奥の物体から手前の物体へ描画
  const objects = [
    ...obstacles.map(o => ({ type: "obstacle", object: o })),
    ...coins.map(c => ({ type: "coin", object: c }))
  ];

  objects.sort((a, b) => a.object.z - b.object.z);

  for (const item of objects) {
    if (item.type === "obstacle") drawObstacle(item.object);
    else drawCoin(item.object);
  }

  drawPlayer();
  drawParticles();

  ctx.restore();

  // 衝突時の画面フラッシュ
  if (flash > 0) {
    ctx.fillStyle = `rgba(255,70,100,${flash * 0.35})`;
    ctx.fillRect(0, 0, W, H);
  }

  // 操作の目安：スタート前に3レーンを見せる
  if (state === "menu") {
    drawLaneLabels();
  }
}

function drawLaneLabels() {
  const y = H * 0.54;

  for (let lane = 0; lane < 3; lane++) {
    const x = laneX(lane, 0.58);

    ctx.fillStyle = "rgba(115,231,255,.65)";
    ctx.font = "bold 11px Arial";
    ctx.textAlign = "center";
    ctx.fillText(
      lane === 0 ? "LEFT" : lane === 1 ? "CENTER" : "RIGHT",
      x,
      y
    );
  }
}

/* =========================
   ゲームループ
========================= */

function loop(now) {
  if (state !== "playing") {
    draw();
    return;
  }

  const dt = Math.min(0.033, Math.max(0, (now - lastTime) / 1000));
  lastTime = now;

  update(dt);
  draw();

  if (state === "playing") {
    requestAnimationFrame(loop);
  }
}

/* =========================
   初期化
========================= */

resetGame();
resize();
draw();
</script>
