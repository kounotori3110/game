<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デコピンゲーム</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px 12px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #fff3df;
  color: #553b2d;
  font-family: Meiryo, sans-serif;
  text-align: center;
}

.game { width: 100%; max-width: 520px; }

h1 {
  font-size: clamp(28px, 7vw, 40px);
  margin: 0 0 8px;
}

.description { font-size: 15px; margin-bottom: 12px; }

.stage {
  position: relative;
  width: 100%;
  height: clamp(330px, 65vh, 470px);
  min-height: 330px;
  overflow: hidden;
  border: 4px solid #e8d0ad;
  border-radius: 24px;
  background: #fff8ed;
  box-shadow: 0 7px 0 #e3c7a2;
  touch-action: none;
  user-select: none;
}

.bubble {
  position: absolute;
  top: 22px;
  left: 50%;
  transform: translateX(-50%);
  max-width: 90%;
  width: max-content;
  padding: 12px 18px;
  background: white;
  border: 3px solid #e7b99d;
  border-radius: 20px;
  font-weight: bold;
  font-size: clamp(15px, 4vw, 20px);
  z-index: 5;
}

.bubble::after {
  content: "";
  position: absolute;
  bottom: -12px;
  left: 50%;
  width: 18px;
  height: 18px;
  background: white;
  border-right: 3px solid #e7b99d;
  border-bottom: 3px solid #e7b99d;
  transform: translateX(-50%) rotate(45deg);
}

.ball {
  position: absolute;
  bottom: 28px;
  width: clamp(82px, 22vw, 104px);
  height: clamp(82px, 22vw, 104px);
  border-radius: 50%;
  background: #ff8fba;
  border: 4px solid #e65f96;
  box-shadow:
    inset -8px -9px 0 rgba(180,42,100,.12),
    inset 7px 7px 0 rgba(255,255,255,.45),
    0 7px 0 #e9a2bd;
  z-index: 2;
}

.ball.left {
  left: calc(50% - clamp(82px, 22vw, 104px) - 5px);
}

.ball.right {
  right: calc(50% - clamp(82px, 22vw, 104px) - 5px);
}

.rod {
  position: absolute;
  left: 50%;
  bottom: 100px;
  width: clamp(38px, 10vw, 54px);
  height: 175px;
  transform: translateX(-50%) rotate(0deg);
  transform-origin: 50% 100%;
  border-radius: 18px 18px 9px 9px;
  background: linear-gradient(
    90deg, #956039 0%, #c58a52 24%,
    #e0b078 48%, #bd8048 72%, #87532f 100%
  );
  border: 3px solid #87532f;
  box-shadow: inset 4px 0 0 rgba(255,255,255,.2),
              4px 5px 0 rgba(89,55,30,.15);
  z-index: 3;
  touch-action: none;
  cursor: pointer;
}

.floor {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 25px;
  background: #efd8b6;
  border-top: 3px solid #e0c39b;
}

.stage.hit .rod { animation: flick .48s ease-in-out; }
.stage.hit .ball { animation: jiggle .48s ease-in-out; }

@keyframes flick {
  0% { transform: translateX(-50%) rotate(0); }
  25% { transform: translateX(-50%) rotate(32deg); }
  55% { transform: translateX(-50%) rotate(-13deg); }
  78% { transform: translateX(-50%) rotate(8deg); }
  100% { transform: translateX(-50%) rotate(0); }
}

@keyframes jiggle {
  0%,100% { transform: translateX(0) scale(1); }
  25% { transform: translateX(-5px) scale(1.05,.95); }
  50% { transform: translateX(5px) scale(.96,1.04); }
  75% { transform: translateX(-3px) scale(1.02,.98); }
}

.power-area {
  margin: 24px auto 18px;
  width: 92%;
  text-align: left;
}

.power-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 8px;
}

#powerText { text-align: right; }

.power-bar {
  height: 28px;
  border-radius: 14px;
  background: #e6d8c6;
  border: 2px solid #cbb49a;
  position: relative;
  overflow: hidden;
}

.power-zone {
  position: absolute;
  left: 75%;
  width: 25%;
  height: 100%;
  background: #7bd99b;
  opacity: .9;
}

#powerFill {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: 0;
  background: #ff982f;
  border-radius: 12px;
  pointer-events: none;
}

#powerMarker {
  position: absolute;
  left: 0;
  top: -2px;
  width: 5px;
  height: 28px;
  border-radius: 3px;
  background: #553b2d;
  transform: translateX(-50%);
  pointer-events: none;
}

.power-label.small {
  margin-top: 7px;
  font-size: 12px;
  color: #866d58;
}

.power-label.small span:nth-child(2) {
  color: #21864b;
  font-weight: bold;
}

.stats {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 20px 0 15px;
  font-size: 19px;
  font-weight: bold;
}

button {
  border: none;
  border-radius: 16px;
  padding: 16px 28px;
  min-height: 56px;
  background: #ff982f;
  color: white;
  font-size: 20px;
  font-weight: bold;
  font-family: inherit;
  box-shadow: 0 5px 0 #d86d16;
  cursor: pointer;
  touch-action: none;
  user-select: none;
}

button:active {
  transform: translateY(3px);
  box-shadow: 0 2px 0 #d86d16;
}

@media (max-width: 360px) {
  .stats { gap: 12px; font-size: 16px; }
  .rod { height: 150px; }
}

@media (prefers-reduced-motion: reduce) {
  .stage.hit .rod, .stage.hit .ball {
    animation-duration: .01ms;
  }
}
</style>
</head>

<body>
<main class="game">
  <h1>デコピンゲーム</h1>
  <div class="description">長押ししてパワーをためよう！</div>

  <div class="stage" id="stage">
    <div class="bubble" id="bubble">準備OK！</div>
    <div class="rod" id="rod" role="button"
         tabindex="0" aria-label="棒を長押し"></div>
    <div class="ball left"></div>
    <div class="ball right"></div>
    <div class="floor"></div>
  </div>

  <div class="power-area">
    <div class="power-label">
      <span>デコピンパワー</span>
      <span id="powerText">長押ししてね！</span>
    </div>
    <div class="power-bar">
      <div class="power-zone"></div>
      <div id="powerFill"></div>
      <div id="powerMarker"></div>
    </div>
    <div class="power-label small">
      <span>弱め</span>
      <span>ベストゾーン！</span>
      <span>強すぎ</span>
    </div>
  </div>

  <div class="stats">
    <div>デコピン回数：<span id="count">0</span></div>
  </div>

  <button id="flickButton" type="button">長押しでデコピン！</button>
</main>

<script>
const stage = document.getElementById("stage");
const rod = document.getElementById("rod");
const bubble = document.getElementById("bubble");
const countText = document.getElementById("count");
const flickButton = document.getElementById("flickButton");
const powerFill = document.getElementById("powerFill");
const powerMarker = document.getElementById("powerMarker");
const powerText = document.getElementById("powerText");

let count = 0;
let animationTimer = null;
let pressStart = 0;
let isPressing = false;
let gaugeFrame = null;
let activePointerId = null;

const messages = {
  weak: "え…//",
  medium: "イク…イク…ンああああああぁっぁぁぁぁぁぁ！！！！",
  strong: "！！！！！！…ドピュ"
};

function updateGauge() {
  if (!isPressing) return;

  const heldTime = Date.now() - pressStart;
  const percent = Math.min(heldTime / 2000, 1) * 100;

  powerFill.style.width = percent + "%";
  powerMarker.style.left = percent + "%";

  if (heldTime < 1500) {
    powerText.textContent = "弱め";
    powerFill.style.background = "#ff982f";
  } else if (heldTime < 2000) {
    powerText.textContent = "ベストゾーン！";
    powerFill.style.background = "#35bd70";
  } else {
    powerText.textContent = "強くなりすぎ！";
    powerFill.style.background = "#ed5b50";
  }

  gaugeFrame = requestAnimationFrame(updateGauge);
}

function startPress(event) {
  if (event && event.type === "keydown" && event.repeat) return;
  if (isPressing) return;

  isPressing = true;
  pressStart = Date.now();
  activePointerId = event && "pointerId" in event
    ? event.pointerId : null;

  powerFill.style.width = "0%";
  powerMarker.style.left = "0%";
  powerFill.style.background = "#ff982f";
  powerText.textContent = "パワー上昇中！";

  if (gaugeFrame !== null) cancelAnimationFrame(gaugeFrame);
  updateGauge();
}

function endPress() {
  if (!isPressing) return;

  const heldTime = Date.now() - pressStart;
  isPressing = false;
  activePointerId = null;

  if (gaugeFrame !== null) {
    cancelAnimationFrame(gaugeFrame);
    gaugeFrame = null;
  }

  let strength;
  if (heldTime < 1500) {
    strength = "weak";
  } else if (heldTime < 2000) {
    strength = "medium";
  } else {
    strength = "strong";
  }

  flick(strength);
}

function flick(strength) {
  count++;
  countText.textContent = count;
  bubble.textContent = messages[strength];

  powerText.textContent =
    strength === "medium" ? "ベスト！" :
    strength === "weak" ? "弱め判定" : "強すぎ判定";

  powerFill.style.background =
    strength === "medium" ? "#35bd70" :
    strength === "weak" ? "#ff982f" : "#ed5b50";

  stage.classList.remove("hit");
  void stage.offsetWidth;
  stage.classList.add("hit");

  clearTimeout(animationTimer);
  animationTimer = setTimeout(() => {
    stage.classList.remove("hit");
  }, 500);
}

function attachPointer(element) {
  element.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    startPress(event);

    try {
      element.setPointerCapture(event.pointerId);
    } catch (_) {}
  });

  element.addEventListener("pointerup", (event) => {
    if (activePointerId !== null &&
        event.pointerId !== activePointerId) return;
    endPress();
  });

  element.addEventListener("pointercancel", endPress);

  element.addEventListener("lostpointercapture", (event) => {
    if (isPressing &&
        (activePointerId === null ||
         event.pointerId === activePointerId)) {
      endPress();
    }
  });
}

attachPointer(flickButton);
attachPointer(rod);

function keyboardStart(event) {
  if (event.code !== "Space" && event.code !== "Enter") return;
  event.preventDefault();
  startPress(event);
}

function keyboardEnd(event) {
  if (event.code !== "Space" && event.code !== "Enter") return;
  event.preventDefault();
  endPress();
}

flickButton.addEventListener("keydown", keyboardStart);
flickButton.addEventListener("keyup", keyboardEnd);
rod.addEventListener("keydown", keyboardStart);
rod.addEventListener("keyup", keyboardEnd);

window.addEventListener("blur", () => {
  if (isPressing) endPress();
});
</script>
</body>
</html>
