<!DOCTYPE>
<html>
<head lang="jp">
<meta charset="UTF-8">
<title>click</title>
<style>
body{
text-align:center;
background:rgb(255,244,179,1)
}
button{
padding:20px 150px;
font-size:30px;
background:rgb(255,255,255,1);
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
}
</style>
</head>
<body>
<button onclick="devil()">ここをクリック</button>
<h1 id="god" style="font-size:100px"></h1>
<script>
let ap=0
function devil(){
ap=ap+1
document.getElementById("god").textContent=ap;
}
</script>
</body>
</html>
